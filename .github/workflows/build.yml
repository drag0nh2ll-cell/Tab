name: Build HealthTab

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HealthTab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: HealthTab-plugin
          path: HealthTab/target/HealthTab.jar
